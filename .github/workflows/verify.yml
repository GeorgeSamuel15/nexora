name: Verify Nexora application
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm check:all

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --global pnpm@11.19.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm setup:env
      - run: docker compose up --build -d --wait --wait-timeout 240
      - run: pnpm test:e2e
      - run: pnpm --filter @nexora/e2e exec playwright install --with-deps chromium
      - run: pnpm test:browser
      - if: failure()
        run: docker compose logs --no-color --tail=150
      - if: always()
        run: docker compose down --volumes
